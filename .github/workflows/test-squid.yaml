# =============================================================================
# test-squid —— squid 代理功能 + 并发测试（GitHub Actions runner）
#
# 前提：runner（默认 linux-amd64-cpu-2, gy-006，多标签 AND）已由 pod 注入
#       squid 代理（HTTP(S)_PROXY + MITM CA），workflow 内【不配置任何代理】。
#
# 结构（对应 META.md 功能面拆解）：
#   function    —— 元自检、基本代理/CONNECT/MITM、域名矩阵、缓存 MISS→HIT、
#                  完整性 sha256、失败面
#   concurrency —— 同对象阶梯并发、异对象并发、混合工具并行
#   parity      —— 透明重写同构校验（no-mirror-test tool-17 全量移植：13 规则
#                  内容签名 + 负样本 + 回归守卫）
#   upstream    —— 上游通道健康（META R17：Actions 构件通道单域集中失败判据、
#                  gh-proxy 延迟预算、read_timeout 数据留档）
#   miss-p95    —— SquidMissP95Slow 告警假慢复现（broker 长轮询 hold 顶爆
#                  MISS p95 的口径缺陷，test-squid/repro-miss-p95.sh）
#   tools       —— 真实工具链 e2e（no-mirror-test tool-* 移植：零镜像配置，
#                  HEAVY=1 追加 rustup/conda/cmake/bazel/precommit）
#   summary     —— 拉回各 job 的 timings/probes，输出汇总表
# =============================================================================
name: test-squid

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'runner 标签（JSON 数组字符串，多标签=AND；需已注入 squid 代理）'
        required: false
        default: '["linux-amd64-cpu-2", "gy-006"]'
      ladder:
        description: '并发度阶梯（空格分隔）'
        required: false
        default: '1 4 8 16'
      heavy:
        description: '1=启用大载荷（~146MB wheel）'
        required: false
        default: '0'
  pull_request:
    paths:
      - 'test-squid/**'
      - '.github/workflows/test-squid.yaml'

permissions:
  contents: read

jobs:
  function:
    name: squid 功能测试
    # 多标签必须用 JSON 数组：表达式里的逗号字符串不会被拆成多标签（会变成
    # 一个字面标签，永远匹配不到 → job 永久 queued）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行功能测试
        run: bash test-squid/run-suite.sh --mode function

      - name: 生成测试载荷（artifact 下载场景用，自产自销）
        run: |
          head -c 1048576 /dev/urandom > /tmp/squid-payload.bin
          sha256sum /tmp/squid-payload.bin | awk '{print $1}' > /tmp/squid-payload.sha256

      - name: 上传测试载荷
        uses: actions/upload-artifact@v7
        with:
          name: squid-test-payload
          path: |
            /tmp/squid-payload.bin
            /tmp/squid-payload.sha256

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-function
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  concurrency:
    name: squid 并发测试
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行并发测试
        # PR 事件无 inputs：阶梯/大载荷走默认值（heavy=0，见 REPORT 教训：
        # PR 事件下 inputs.* 为空字符串，不能直接引用）
        run: |
          LADDER="${{ github.event_name == 'pull_request' && '1 4 8 16' || inputs.ladder }}" \
          HEAVY="${{ github.event_name == 'pull_request' && '0' || inputs.heavy }}" \
          bash test-squid/run-suite.sh --mode concurrency

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-concurrency
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  container-function:
    name: 容器层·功能测试（CANN 镜像）
    needs: function
    # container: 形态 —— 验证 squid 注入在用户镜像内同样生效（env 传递 + CA 灌库）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    container:
      image: swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12
    steps:
      # CANN 镜像 insteadOf 重写 github.com → gh-proxy 是环境正道，gitconfig 保留。
      # 仓库已转 public：gh-proxy 匿名可拉，无需额外凭据（此前 401 系私有仓库所致）
      - uses: actions/checkout@v7

      - name: 运行功能测试（容器层）
        run: bash test-squid/run-suite.sh --mode function --container

      # 场景 artifact-download：GHA artifact 下载流量经 squid（dawidd6 走
      # github API + 对象存储；needs: function 保证载荷已上传，无竞态）
      - name: 场景 artifact-download（dawidd6/action-download-artifact）
        uses: dawidd6/action-download-artifact@v27
        with:
          github_token: ${{ github.token }}
          run_id: ${{ github.run_id }}
          name: squid-test-payload
          path: payload-download

      - name: 校验 artifact 完整性
        run: echo "$(cat payload-download/squid-payload.sha256)  payload-download/squid-payload.bin" | sha256sum -c -

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-container-function
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  container-concurrency:
    name: 容器层·并发测试（CANN 镜像）
    needs: function
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    container:
      image: swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12
    steps:
      - uses: actions/checkout@v7

      - name: 运行并发测试（容器层）
        run: |
          LADDER="${{ github.event_name == 'pull_request' && '1 4 8 16' || inputs.ladder }}" \
          HEAVY="${{ github.event_name == 'pull_request' && '0' || inputs.heavy }}" \
          bash test-squid/run-suite.sh --mode concurrency --container

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-container-concurrency
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  vllm:
    name: vllm 通信模拟（runner 层）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行 vLLM 通信模拟
        run: bash test-squid/run-suite.sh --mode vllm

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-vllm
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  container-vllm:
    name: vllm 通信模拟（CANN 镜像）
    needs: function
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    container:
      image: swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12
    steps:
      - uses: actions/checkout@v7

      - name: 运行 vLLM 通信模拟（容器层）
        run: bash test-squid/run-suite.sh --mode vllm --container

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-container-vllm
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  parity:
    name: 透明重写同构校验（tool-17 全量）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行重写同构校验
        run: bash test-squid/run-suite.sh --mode parity

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-parity
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  tools:
    name: 真实工具链 e2e（no-mirror 形态）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行真实工具 e2e
        run: |
          HEAVY="${{ github.event_name == 'pull_request' && '0' || inputs.heavy }}" \
          bash test-squid/run-suite.sh --mode tools

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-tools
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  container-tools:
    name: 容器层·真实工具 e2e（CANN 镜像）
    needs: function
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    container:
      image: swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12
    steps:
      - uses: actions/checkout@v7

      - name: 运行真实工具 e2e（容器层）
        run: |
          HEAVY="${{ github.event_name == 'pull_request' && '0' || inputs.heavy }}" \
          bash test-squid/run-suite.sh --mode tools --container

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-container-tools
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  upstream:
    name: 上游通道健康（R17：Actions 构件/gh-proxy）
    # runner 层 only：Actions 构件通道与 gh-proxy 是 runner 环境关心的事，
    # 与执行层（容器/CA）无关；判定采用单域集中失败 + 延迟预算（META R17）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行上游通道健康检查
        run: bash test-squid/run-suite.sh --mode upstream

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-upstream
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  miss-p95:
    name: MISS p95 假慢复现（broker 长轮询诊断）
    # 2026-10-09 SquidMissP95Slow 告警诊断的复现场景：GHA runner 保活长轮询
    # （broker.actions.githubusercontent.com）hold ~57s 才回，占比 >5% 即把
    # 滚动窗 MISS p95 钉在 hold 值上（aiframework p95=57.44813 两分片同值）。
    # mock origin 复刻 fast/blob(10-12s)/poll(57s hold) 三形态经 squid 打点，
    # 断言"全量 p95 落 hold 区间 + 排除 poll 后健康"；第二遍 NO_PROXY 对照
    # （poll 直连旁路 + fast/blob 照常经 squid）验证旁路后 squid 口径恢复健康
    # （test-squid/repro-miss-p95.sh）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行 MISS p95 假慢复现
        # squid 地址来自 pod 注入的 env（workflow 内不配置代理——被测对象本身）
        run: |
          PX="${HTTP_PROXY:-${http_proxy:-}}" \
          bash test-squid/repro-miss-p95.sh

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-miss-p95
          path: /tmp/repro-miss-p95/
          if-no-files-found: warn

  container-miss-p95:
    name: 容器层·MISS p95 假慢复现（CANN 镜像）
    # 告警里的 MISS 流量负载（artifact 上传/长轮询等）实际在用户容器里产生，
    # 容器层验证同一复现链（squid 回源 pod IP + CA/工具链差异不参与本场景，
    # 但多验一层执行形态与套件其余组保持两层对称）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    container:
      image: swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12
    steps:
      - uses: actions/checkout@v7

      - name: 运行 MISS p95 假慢复现（容器层）
        run: |
          PX="${HTTP_PROXY:-${http_proxy:-}}" GROUP=container \
          bash test-squid/repro-miss-p95.sh

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-container-miss-p95
          path: /tmp/repro-miss-p95/
          if-no-files-found: warn

  summary:
    name: 汇总
    needs: [function, concurrency, vllm, parity, tools, upstream, miss-p95, container-function, container-concurrency, container-vllm, container-tools, container-miss-p95]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 拉取结果
        uses: actions/download-artifact@v8
        with:
          pattern: test-squid-*
          merge-multiple: false

      - name: 汇总表
        if: always()
        run: |
          echo "## test-squid 汇总" >> "$GITHUB_STEP_SUMMARY"
          for d in test-squid-function test-squid-concurrency test-squid-vllm test-squid-parity test-squid-upstream test-squid-tools test-squid-miss-p95 \
                   test-squid-container-function test-squid-container-concurrency test-squid-container-vllm test-squid-container-tools test-squid-container-miss-p95; do
            if [ -f "$d/timings.tsv" ] || [ -f "$d/probes.tsv" ]; then
              echo "### $d" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              # 逐文件判断后 cat：miss-p95 artifact 只有 probes.tsv 没有
              # timings.tsv，cat 对缺失文件 exit 1 会让 bash -e 直接退出
              for f in timings.tsv probes.tsv; do
                if [ -f "$d/$f" ]; then
                  cat "$d/$f" >> "$GITHUB_STEP_SUMMARY"
                fi
              done
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ -f test-squid-function/probes.tsv ]; then
            echo "### 域名探测" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat test-squid-function/probes.tsv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"
