# =============================================================================
# test-squid —— squid 代理功能 + 并发测试（GitHub Actions runner）
#
# 前提：runner（默认 linux-amd64-cpu-2, gy-006，多标签 AND）已由 pod 注入
#       squid 代理（HTTP(S)_PROXY + MITM CA），workflow 内【不配置任何代理】。
#
# 结构（对应 META.md 功能面拆解）：
#   function    —— 元自检、基本代理/CONNECT/MITM、缓存 MISS→HIT、
#                  完整性 sha256、失败面
#   concurrency —— 同对象阶梯并发、异对象并发、混合工具并行
#   parity      —— 透明重写同构校验（no-mirror-test tool-17 全量移植：13 规则
#                  内容签名 + 负样本 + 回归守卫）
#   upstream    —— 上游通道健康（META R17：gh-proxy 延迟预算（A/B 对照）、
#                  read_timeout 数据留档；Actions 构件通道已入 NO_PROXY 直连，
#                  不测不过 squid 的流量）
#   imagebuild  —— 镜像构建网络模拟（vllm-ascend Dockerfile.310p 外网面：
#                  catlass 子模块 + cmake 第三方压缩包 + GIT_PROXY clone vllm）
#   cabundle    —— no_proxy 直连 × CA 注入矩阵（排他/union/追加三语义工具，
#                  CA 形态取证 + no_proxy 生效性 + 直连/MITM 双路径 +
#                  新增直连域（云元数据/LLM 统计/API，PR #2194）绕行验证）
#   miss-p95    —— SquidMissP95Slow 告警假慢复现（broker 长轮询 hold 顶爆
#                  MISS p95 的口径缺陷，test-squid/repro-miss-p95.sh）
#   tools       —— 真实工具链 e2e（no-mirror-test tool-* 移植：零镜像配置，
#                  HEAVY=1 追加 rustup/conda/cmake/bazel/precommit）
#   pkg         —— dnf/yum 包管理链路（openEuler 24.03 容器层，R20：RHEL 系
#                  CA 信任路径 + 原生 rpm 源/GPG 校验）
#   stale-index —— 索引页陈旧复现（源站 max-age 15 天 → squid 长期供旧页，
#                  2026-10-29 triton-ascend 3.6.0.post2 构建失败回归守卫）
#   summary     —— 拉回各 job 的 timings/probes，输出汇总表
# =============================================================================
name: test-squid

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'runner 标签（JSON 数组字符串，多标签=AND；需已注入 squid 代理）'
        required: false
        default: '["linux-amd64-cpu-2", "gy-006"]'
      ladder:
        description: '并发度阶梯（空格分隔）'
        required: false
        default: '1 4 8 16'
      heavy:
        description: '1=启用大载荷（~146MB wheel）'
        required: false
        default: '0'
      bundle_fix:
        description: '1=cabundle 矩阵把 CA 变量重指向系统 bundle（验证根修形态，postStart 预演）'
        required: false
        default: '0'
      np_strict:
        description: '1=新增直连域（云元数据/LLM 统计/API）必须全部命中 NO_PROXY（gy-006 cpu-2 配置验证用）'
        required: false
        default: '0'
      gitcode:
        description: '1=启用 gitcode.com → 缓存后端的 insteadOf 重写与缓存命中验证（需目标 runner 已注入；必须容器层）'
        required: false
        default: '0'
      gitcode_backend:
        description: 'gitcode 缓存后端：smart-git-proxy（gy-005，带 /gitcode.com 前缀）/ git-cdn-gitcode（gy-006 #2237）'
        required: false
        type: choice
        options:
          - smart-git-proxy
          - git-cdn-gitcode
        default: smart-git-proxy
      gitcode_direct:
        description: '1=跳过 insteadOf 断言，直连缓存后端（用于目标 runner 未注入重写时验证后端服务本身）'
        required: false
        default: '0'
      gitcode_lfs_repo:
        description: 'LFS 验证用的 gitcode 仓库 URL（空=用 GITCODE_REPO，无 filter=lfs 则 SKIP）'
        required: false
        default: ''
      container_image:
        description: 'CANN 容器层镜像（跨集群拉取慢时换成就近仓库，如 quay.io/ascend/cann:9.0.0-a3-ubuntu22.04-py3.12）'
        required: false
        default: 'swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12'
      openeuler_image:
        description: 'dnf/yum 容器层镜像（跨集群拉取慢时换成就近仓库，如 quay.io/openeuler/openeuler:24.03）'
        required: false
        default: 'swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/openeuler/openeuler:24.03'
      stale_index:
        description: '1=启用索引页陈旧复现（源站 max-age 15 天 → squid 长期供旧页；2026-10-29 post2 构建失败回归守卫）'
        required: false
        default: '0'
      stale_strict:
        description: '1=parity 严格模式：经 squid HIT 且 Age 超阈值（900s）判红（验证短 TTL 规则已生效）'
        required: false
        default: '1'
  pull_request:
    paths:
      - 'test-squid/**'
      - '.github/workflows/test-squid.yaml'

permissions:
  contents: read

jobs:
  function:
    name: squid 功能测试
    # 多标签必须用 JSON 数组：表达式里的逗号字符串不会被拆成多标签（会变成
    # 一个字面标签，永远匹配不到 → job 永久 queued）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行功能测试
        run: bash test-squid/run-suite.sh --mode function

      - name: 生成测试载荷（artifact 下载场景用，自产自销）
        run: |
          head -c 1048576 /dev/urandom > /tmp/squid-payload.bin
          sha256sum /tmp/squid-payload.bin | awk '{print $1}' > /tmp/squid-payload.sha256

      - name: 上传测试载荷
        uses: actions/upload-artifact@v7
        with:
          name: squid-test-payload
          path: |
            /tmp/squid-payload.bin
            /tmp/squid-payload.sha256

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-function
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  concurrency:
    name: squid 并发测试
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行并发测试
        # PR 事件无 inputs：阶梯/大载荷走默认值（heavy=0，见 REPORT 教训：
        # PR 事件下 inputs.* 为空字符串，不能直接引用）
        run: |
          LADDER="${{ github.event_name == 'pull_request' && '1 4 8 16' || inputs.ladder }}" \
          HEAVY="${{ github.event_name == 'pull_request' && '0' || inputs.heavy }}" \
          bash test-squid/run-suite.sh --mode concurrency

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-concurrency
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  container-function:
    name: 容器层·功能测试（CANN 镜像）
    needs: function
    # container: 形态 —— 验证 squid 注入在用户镜像内同样生效（env 传递 + CA 灌库）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    container:
      image: ${{ inputs.container_image || 'swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12' }}
    steps:
      # CANN 镜像 insteadOf 重写 github.com → gh-proxy 是环境正道，gitconfig 保留。
      # 仓库已转 public：gh-proxy 匿名可拉，无需额外凭据（此前 401 系私有仓库所致）
      - uses: actions/checkout@v7

      - name: 运行功能测试（容器层）
        run: bash test-squid/run-suite.sh --mode function --container

      # 场景 artifact-download：GHA artifact 下载流量经 squid（官方 v8 走
      # Actions artifact API + 对象存储，与 v7 上传配套；needs: function
      # 保证载荷已上传，无竞态）
      - name: 场景 artifact-download
        uses: actions/download-artifact@v8
        with:
          name: squid-test-payload
          path: payload-download

      - name: 校验 artifact 完整性
        run: echo "$(cat payload-download/squid-payload.sha256)  payload-download/squid-payload.bin" | sha256sum -c -

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-container-function
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  container-concurrency:
    name: 容器层·并发测试（CANN 镜像）
    # 容器层五 job 用 needs 链串行（runner 层照常并行）：并行触发多个
    # container hook 会踩 runner-container-hooks 的挂死竞态（连接死亡后
    # Promise 不 reject，job 永挂 Initialize containers，见 issue #2，
    # 2026-10-10 8 集群并行验证 10/10 复现），串行化牺牲时长换稳定
    needs: [concurrency, container-function]
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    container:
      image: ${{ inputs.container_image || 'swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12' }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行并发测试（容器层）
        run: |
          LADDER="${{ github.event_name == 'pull_request' && '1 4 8 16' || inputs.ladder }}" \
          HEAVY="${{ github.event_name == 'pull_request' && '0' || inputs.heavy }}" \
          bash test-squid/run-suite.sh --mode concurrency --container

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-container-concurrency
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  vllm:
    name: vllm 通信模拟（runner 层）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行 vLLM 通信模拟
        run: bash test-squid/run-suite.sh --mode vllm

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-vllm
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  container-vllm:
    name: vllm 通信模拟（CANN 镜像）
    needs: [vllm, container-concurrency]
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    container:
      image: ${{ inputs.container_image || 'swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12' }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行 vLLM 通信模拟（容器层）
        run: bash test-squid/run-suite.sh --mode vllm --container

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-container-vllm
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  parity:
    name: 透明重写同构校验（tool-17 全量）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行重写同构校验
        run: bash test-squid/run-suite.sh --mode parity

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-parity
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  tools:
    name: 真实工具链 e2e（no-mirror 形态）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行真实工具 e2e
        run: |
          HEAVY="${{ github.event_name == 'pull_request' && '0' || inputs.heavy }}" \
          bash test-squid/run-suite.sh --mode tools

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-tools
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  container-tools:
    name: 容器层·真实工具 e2e（CANN 镜像）
    needs: [tools, container-vllm]
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    container:
      image: ${{ inputs.container_image || 'swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12' }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行真实工具 e2e（容器层）
        run: |
          HEAVY="${{ github.event_name == 'pull_request' && '0' || inputs.heavy }}" \
          bash test-squid/run-suite.sh --mode tools --container

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-container-tools
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  upstream:
    name: 上游通道健康（R17：gh-proxy/read_timeout）
    # runner 层 only：gh-proxy 是 runner 环境关心的事，与执行层（容器/CA）无关；
    # Actions 构件通道两域已入 NO_PROXY 直连，不测不过 squid 的流量（META R17）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行上游通道健康检查
        run: bash test-squid/run-suite.sh --mode upstream

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-upstream
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  imagebuild:
    name: 镜像构建网络模拟（vllm-ascend 外网面）
    # runner 层 only：复刻 Dockerfile.310p 构建的出网面——catlass 子模块
    # （gitcode.com）、cmake 第三方压缩包（gitcode.com/cann-src-third-party）、
    # GIT_PROXY insteadOf clone vllm（github.com 大 pack）；集群内 cache-service
    # 已入 NO_PROXY 直连，不测不过 squid 的流量
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行镜像构建网络模拟
        run: bash test-squid/run-suite.sh --mode imagebuild

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-imagebuild
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  cabundle:
    name: no_proxy × CA 注入矩阵
    # 平台向 pod 注入 6 个 CA 变量（全指向 /etc/squid-ca/squid-ca.pem）：排他
    # CAfile（CURL_CA_BUNDLE/REQUESTS_CA_BUNDLE/GIT_SSL_CAINFO/PIP_CERT）、
    # 库级 union（SSL_CERT_FILE）、追加（NODE_EXTRA_CA_CERTS）。风险：no_proxy
    # 命中 → 直连 → 对端是公共 CA 证书，排他变量若指向纯 squid CA（无公共根）
    # 则直连断裂。本组取证 CA 文件形态（纯 CA vs bundle）+ no_proxy 生效性 +
    # 工具×路径矩阵 + 新增直连域（PR #2194 首批）是否绕开 squid
    # （test-squid/no-proxy-ca-test.sh）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行 no_proxy × CA 矩阵
        env:
          BUNDLE_FIX: ${{ github.event_name == 'pull_request' && '0' || inputs.bundle_fix }}
          # 新增直连域（PR #2194 首批）只在 gy-006 linux-amd64-cpu-2 模板落地。
          # 默认宽松：未纳入本批的 runner set 记录 SKIP 不判红（分批推进）；
          # 手动 np_strict=1 时要求 6 个域全部命中 NO_PROXY（配置落地验证）。
          NP_DOMAIN_STRICT: ${{ github.event_name == 'pull_request' && '0' || inputs.np_strict }}
        run: bash test-squid/run-suite.sh --mode cabundle

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-cabundle
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  gitcode:
    name: gitcode × 缓存后端（opt-in，容器层）
    # 挂在容器链末尾（container-pkg 之后）串行（issue #2 挂死竞态：容器作业
    # 必须一个接一个），且不在任何容器 job 的 needs 上游——gitcode=0 被 skip
    # 时不会拖累前面的容器链。
    needs: [container-pkg]
    # 定向验证（R21）：pod postStart 追加
    #   url.<smart-git-proxy>/gitcode.com/.insteadOf = https://gitcode.com/
    # 后，gitcode.com 的 git 拉取是否真的走 smart git proxy、重复拉取是否命中
    # 缓存。该 service 属 .svc.cluster.local（NO_PROXY）→ 直连绕开 squid，
    # 因此本组不跑 meta-trace，也不代表 squid 的缓存能力。
    #
    # ⚠️ 必须容器层：insteadOf 由 job pod 模板（ConfigMap default.yaml）的
    # postStart 写入 /root/.gitconfig，只对 `container:` 作业容器生效；
    # runner 容器走的是 AutoscalingRunnerSet values.yaml 的 env/postStart，
    # 没有这条重写（gy-005 cpu-8 实测），runner 层跑必判"未重写"。
    # always() 保证前面容器环节失败时这条定向验证仍能给出结论。
    if: always() && github.event_name == 'workflow_dispatch' && inputs.gitcode == '1'
    runs-on: ${{ fromJSON(inputs.runner) }}
    container:
      image: ${{ inputs.container_image || 'swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12' }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行 gitcode 缓存验证（容器层）
        env:
          GITCODE_STRICT: '1'   # 定向验证：重写缺失 / 无缓存收益 → 判红
          GITCODE_DIRECT: ${{ inputs.gitcode_direct }}
          # 两种后端只差基址：smart-git-proxy 带 /gitcode.com 前缀段，
          # git-cdn-gitcode（#2237）以仓库路径挂在根上；脚本从展开结果反推。
          GITCODE_PROXY: ${{ inputs.gitcode_backend == 'git-cdn-gitcode' && 'http://git-cdn-service.git-cdn-gitcode.svc.cluster.local:8000' || 'http://smart-git-proxy-service.smart-git-proxy.svc.cluster.local:8080' }}
          GITCODE_LFS_REPO: ${{ inputs.gitcode_lfs_repo }}
        run: bash test-squid/run-suite.sh --mode gitcode --container

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-gitcode
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  miss-p95:
    name: MISS p95 假慢复现（broker 长轮询诊断）
    # 2026-10-09 SquidMissP95Slow 告警诊断的复现场景：GHA runner 保活长轮询
    # （broker.actions.githubusercontent.com）hold ~57s 才回，占比 >5% 即把
    # 滚动窗 MISS p95 钉在 hold 值上（aiframework p95=57.44813 两分片同值）。
    # mock origin 复刻 fast/blob(10-12s)/poll(57s hold) 三形态经 squid 打点，
    # 断言"全量 p95 落 hold 区间 + 排除 poll 后健康"；第二遍 NO_PROXY 对照
    # （poll 直连旁路 + fast/blob 照常经 squid）验证旁路后 squid 口径恢复健康
    # （test-squid/repro-miss-p95.sh）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行 MISS p95 假慢复现
        # squid 地址来自 pod 注入的 env（workflow 内不配置代理——被测对象本身）
        run: |
          PX="${HTTP_PROXY:-${http_proxy:-}}" \
          bash test-squid/repro-miss-p95.sh

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-miss-p95
          path: /tmp/repro-miss-p95/
          if-no-files-found: warn

  stale-index:
    name: 索引页陈旧复现（max-age 陷阱）
    # 2026-10-29 triton-ascend 3.6.0.post2 构建失败取证：镜像源 10-28 21:50 已
    # 重新生成索引页（含 post2），squid 因源站 Cache-Control: max-age=1296000
    # （15 天）判新鲜、不回源验证，18:32:58 仍供旧页 → pip No matching distribution；
    # 两台副本先后换页后（19:33）才自愈（失败窗口约 1 小时）。
    # 两个阶段：mock 机制复现（长 max-age + 翻页后仍供旧页）+ 真实索引页
    # squid×源站直连清单对照（test-squid/repro-stale-index.sh，R15 回归守卫）。
    # opt-in：stale_index=1 才跑（修复未落地时 parity 会红，属预期）。
    if: always() && github.event_name == 'workflow_dispatch' && inputs.stale_index == '1'
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行索引页陈旧复现
        env:
          STALE_STRICT: ${{ inputs.stale_strict }}
        run: bash test-squid/run-suite.sh --mode stale-index

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-stale-index
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  container-miss-p95:
    name: 容器层·MISS p95 假慢复现（CANN 镜像）
    needs: [miss-p95, container-tools]
    # 告警里的 MISS 流量负载（artifact 上传/长轮询等）实际在用户容器里产生，
    # 容器层验证同一复现链（squid 回源 pod IP + CA/工具链差异不参与本场景，
    # 但多验一层执行形态与套件其余组保持两层对称）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    container:
      image: ${{ inputs.container_image || 'swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12' }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行 MISS p95 假慢复现（容器层）
        run: |
          PX="${HTTP_PROXY:-${http_proxy:-}}" GROUP=container \
          bash test-squid/repro-miss-p95.sh

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-container-miss-p95
          path: /tmp/repro-miss-p95/
          if-no-files-found: warn

  container-imagebuild:
    name: 容器层·镜像构建网络模拟（CANN 镜像）
    needs: [imagebuild, container-miss-p95]
    # 容器层复刻更贴近真实构建执行环境：cmake REQ_URL 拉包与 Dockerfile L92 的
    # vllm clone 本就发生在 build 容器内；镜像自带 gitconfig insteadOf（环境正道）
    # 与脚本 -c 同值叠加，验证镜像内 gitconfig 形态下三路外网流量全通 + CA 信任路径
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    container:
      image: ${{ inputs.container_image || 'swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12' }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行镜像构建网络模拟（容器层）
        run: bash test-squid/run-suite.sh --mode imagebuild --container

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-container-imagebuild
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  container-cabundle:
    name: 容器层·no_proxy × CA 注入矩阵（CANN 镜像）
    needs: [cabundle, container-imagebuild]
    # 容器内 env 由 postStart/CA 卷注入同一组变量，多验一层 CA 信任路径与
    # 镜像内工具链（python/pip/git）的排他语义表现
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    container:
      image: ${{ inputs.container_image || 'swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12' }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行 no_proxy × CA 矩阵（容器层）
        env:
          BUNDLE_FIX: ${{ github.event_name == 'pull_request' && '0' || inputs.bundle_fix }}
        run: bash test-squid/run-suite.sh --mode cabundle --container

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-container-cabundle
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  container-pkg:
    name: 容器层·dnf/yum（openEuler 24.03）
    needs: [container-cabundle]
    # dnf/yum 只有 openEuler/RHEL 基底才能真实执行（runner 与 CANN 镜像均 ubuntu，
    # 套件内 pkg 阶段在两处 SKIP）。该镜像不带 git：先 dnf 装 git-core 引导
    # checkout——这一步本身就是真实 dnf 安装链路（含 GPG key 校验：gpgkey 走
    # http://repo.openeuler.org，正是规则10 的 yum host 交换域）。
    # CA 信任走 RHEL 路径：注入脚本 anchors + update-ca-trust extract。
    # 容器层 job 仍须串行（issue #2 挂死竞态），挂在本链末尾。
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    container:
      image: ${{ inputs.openeuler_image || 'swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/openeuler/openeuler:24.03' }}
    steps:
      - name: 引导 git（dnf 真实安装；镜像默认 repo 含 debuginfo/source，仅开 OS）
        run: dnf -y --disablerepo='*' --enablerepo=OS install git-core

      - uses: actions/checkout@v7

      - name: 运行 dnf/yum 测试（容器层）
        run: bash test-squid/run-suite.sh --mode pkg --container

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-squid-container-pkg
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  summary:
    name: 汇总
    needs: [function, concurrency, vllm, parity, tools, upstream, imagebuild, cabundle, miss-p95, gitcode, stale-index, container-function, container-concurrency, container-vllm, container-tools, container-miss-p95, container-imagebuild, container-cabundle, container-pkg]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 拉取结果
        uses: actions/download-artifact@v8
        with:
          pattern: test-squid-*
          merge-multiple: false

      - name: 汇总表
        if: always()
        run: |
          echo "## test-squid 汇总" >> "$GITHUB_STEP_SUMMARY"
          for d in test-squid-function test-squid-concurrency test-squid-vllm test-squid-parity test-squid-upstream test-squid-imagebuild test-squid-cabundle test-squid-tools test-squid-miss-p95 test-squid-gitcode test-squid-stale-index \
                   test-squid-container-function test-squid-container-concurrency test-squid-container-vllm test-squid-container-tools test-squid-container-miss-p95 test-squid-container-imagebuild test-squid-container-cabundle test-squid-container-pkg; do
            if [ -f "$d/timings.tsv" ] || [ -f "$d/probes.tsv" ]; then
              echo "### $d" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              # 逐文件判断后 cat：miss-p95 artifact 只有 probes.tsv 没有
              # timings.tsv，cat 对缺失文件 exit 1 会让 bash -e 直接退出
              for f in timings.tsv probes.tsv; do
                if [ -f "$d/$f" ]; then
                  cat "$d/$f" >> "$GITHUB_STEP_SUMMARY"
                fi
              done
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ -f test-squid-function/probes.tsv ]; then
            echo "### 域名探测" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat test-squid-function/probes.tsv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"
