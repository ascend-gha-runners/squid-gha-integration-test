# =============================================================================
# test-squid —— squid 代理功能 + 并发测试（GitHub Actions runner）
#
# 前提：runner（默认 linux-amd64-cpu-4）已由 pod 注入 squid 代理
#       （HTTP(S)_PROXY + MITM CA），workflow 内【不配置任何代理】。
#
# 结构（对应 META.md 功能面拆解）：
#   function    —— 元自检、基本代理/CONNECT/MITM、域名矩阵、缓存 MISS→HIT、
#                  完整性 sha256、失败面
#   concurrency —— 同对象阶梯并发、异对象并发、混合工具并行
#   summary     —— 拉回两 job 的 timings/probes，输出汇总表
# =============================================================================
name: test-squid

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'runner 标签（JSON 数组字符串，多标签=AND；需已注入 squid 代理）'
        required: false
        default: '["linux-amd64-cpu-2", "gy-006"]'
      ladder:
        description: '并发度阶梯（空格分隔）'
        required: false
        default: '1 4 8 16'
      heavy:
        description: '1=启用大载荷（~146MB wheel）'
        required: false
        default: '0'
  pull_request:
    paths:
      - 'test-squid/**'
      - '.github/workflows/test-squid.yaml'

permissions:
  contents: read

jobs:
  function:
    name: squid 功能测试
    # 多标签必须用 JSON 数组：表达式里的逗号字符串不会被拆成多标签（会变成
    # 一个字面标签，永远匹配不到 → job 永久 queued）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v4

      - name: 运行功能测试
        run: bash test-squid/run-suite.sh --mode function

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-squid-function
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  concurrency:
    name: squid 并发测试
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    steps:
      - uses: actions/checkout@v4

      - name: 运行并发测试
        # PR 事件无 inputs：阶梯/大载荷走默认值（heavy=0，见 REPORT 教训：
        # PR 事件下 inputs.* 为空字符串，不能直接引用）
        run: |
          LADDER="${{ github.event_name == 'pull_request' && '1 4 8 16' || inputs.ladder }}" \
          HEAVY="${{ github.event_name == 'pull_request' && '0' || inputs.heavy }}" \
          bash test-squid/run-suite.sh --mode concurrency

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-squid-concurrency
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  container-function:
    name: 容器层·功能测试（CANN 镜像）
    # container: 形态 —— 验证 squid 注入在用户镜像内同样生效（env 传递 + CA 灌库）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    container:
      image: swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12
    steps:
      - uses: actions/checkout@v4

      - name: 运行功能测试（容器层）
        run: bash test-squid/run-suite.sh --mode function --container

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-squid-container-function
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  container-concurrency:
    name: 容器层·并发测试（CANN 镜像）
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["linux-amd64-cpu-2", "gy-006"]' || inputs.runner) }}
    container:
      image: swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12
    steps:
      - uses: actions/checkout@v4

      - name: 运行并发测试（容器层）
        run: |
          LADDER="${{ github.event_name == 'pull_request' && '1 4 8 16' || inputs.ladder }}" \
          HEAVY="${{ github.event_name == 'pull_request' && '0' || inputs.heavy }}" \
          bash test-squid/run-suite.sh --mode concurrency --container

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-squid-container-concurrency
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  summary:
    name: 汇总
    needs: [function, concurrency, container-function, container-concurrency]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 拉取结果
        uses: actions/download-artifact@v4
        with:
          pattern: test-squid-*
          merge-multiple: false

      - name: 汇总表
        if: always()
        run: |
          echo "## test-squid 汇总" >> "$GITHUB_STEP_SUMMARY"
          for d in test-squid-function test-squid-concurrency test-squid-container-function test-squid-container-concurrency; do
            if [ -f "$d/timings.tsv" ]; then
              echo "### $d" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat "$d/timings.tsv" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ -f test-squid-function/probes.tsv ]; then
            echo "### 域名探测" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat test-squid-function/probes.tsv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"
