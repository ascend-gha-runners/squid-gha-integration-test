name: test-gitcdn

# git-cdn 服务本身的回归工作流（与 test-squid.yaml 分开）
#
# 区别：test-squid.yaml 测的是 squid（代理/CONNECT/MITM/缓存/重写），
# 本工作流只测 git-cdn 的**回源能力**，显式打 git-cdn 基址，
# 不依赖宿主的 insteadOf、不经过 squid。
#
# 用例：test-squid/repro-gitcdn-unsynced-sha.sh（META R23）
#   ① 用 API 造一个「上游可服务、git-cdn 缓存必定没有」的 SHA（临时 ref + 空提交）
#   ② 对照组：直连 github.com 取该 SHA，确认上游确实有（否则 SKIP）
#   ②b gh-proxy 入参形态对照：正确形态必须 200（否则判红）；缺前缀形态只留档
#   ③ 经 git-cdn 按真实客户端形态（Basic 凭据）取该 SHA
#      —— 成功 = git-cdn 回源健康；50s 后 not our ref = 缺陷复现（2026-11-04 事故）
#
# 需要 contents: write（建/删临时 ref）。
#
# 另含「最新 commit 滚动校验」job（gitcdn-latest）：
#   每 30 分钟（schedule）对 ascend-ci-deployment#2048 的构建仓及其依赖仓，
#   ① 先取上游最新 commit（真值），② 再经 git-cdn 取对象（POSE=fetch 默认：fetch --depth 1；
#   POSE=clone：全量 clone 后切 commit），③ 真值 commit 不在本地则按真值 SHA 回源取一次。
#   取不到最新 commit 即判红 —— 持续守 2026-11-04「缓存缺新 SHA → not our ref」这一类问题。

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'runner 标签 JSON 数组（数组内多标签为 AND 关系）'
        required: false
        default: '["linux-amd64-cpu-2", "gy-006"]'
        type: string
      latest:
        description: '1 = 跑一次「最新 commit 滚动校验」（原 30 分钟定时任务已移除）'
        required: false
        default: '1'
        type: string
      latest_repos:
        description: '滚动校验仓库清单（空格/逗号分隔 owner/repo；gitcode: 前缀走 gitcode 上游；空 = 默认清单）'
        required: false
        default: ''
        type: string
      pose:
        description: '取对象姿势：fetch = init + fetch --depth 1（默认）；clone = 全量 clone 后再切 commit'
        required: false
        default: 'fetch'
        type: choice
        options:
          - fetch
          - clone
      clone_timeout:
        description: '单仓取对象超时秒（0 = 按仓库体积自动估：体积/2+120，180~1200）'
        required: false
        default: '0'
        type: string
      pytorch_submodule:
        description: '1 = 启用 pytorch/pytorch「depth=1 + 全量子模块」经 git-cdn 的克隆耗时用例（大流量，仅手动）'
        required: false
        default: '0'
        type: string
      pytorch_runs:
        description: 'pytorch 用例轮数：1 = 只测一轮（冷缓存）；2 = 追加一轮热缓存对照'
        required: false
        default: '1'
        type: string
      pytorch_submodules:
        description: '限定子模块路径（空格分隔，如 third_party/cutlass third_party/flash-attention；空 = 全量 36 个）'
        required: false
        default: ''
        type: string
      pytorch_jobs_ladder:
        description: '拨测档位（空格分隔）：jobs:N / update:N / par:N / fetchjobs0 / filter:blob:none；非空时每档一轮全新克隆，忽略 pytorch_runs'
        required: false
        default: ''
        type: string
      pytorch_work_dir:
        description: '克隆落盘目录（默认 /tmp/gitcdn-pytorch；填 /dev/shm/gitcdn-pytorch 可做 tmpfs 对照，排除落盘 IO）'
        required: false
        default: ''
        type: string
      pytorch_trace_perf:
        description: '1 = 打开 GIT_TRACE_PERFORMANCE，按 index-pack/checkout/fetch 归类留档每个 git 子命令耗时（判定慢在取数还是落盘）'
        required: false
        default: '0'
        type: string
      pytorch_git_upgrade:
        description: '1 = 先升级 runner 上的 git（<2.36 不支持 submodule update --filter，官方 blobless/treeless 姿势用不了）'
        required: false
        default: '0'
        type: string
      pytorch_baseline:
        description: '1 = 用 GitHub 托管 runner（ubuntu-latest）跑同一脚本、直连 github.com，作环境对照基线'
        required: false
        default: '0'
        type: string
      gitcdn_rebuild:
        description: '1 = 跑 git-cdn-rebuild chart 灰度验证（ADR-0015：client_max_size / allowfilter / refs-pull 排除 / 浅包缓存）'
        required: false
        default: '0'
        type: string

      subjobs_bench:
        description: '1 = 第一层子模块对照：git 原生 update --jobs 32 vs 手动 xargs -P 32 逐路径并发'
        required: false
        default: '0'
        type: string

      subjobs_order:
        description: '执行哪些腿及顺序：a,b（原生 vs 手动）/ b,a / c（--recursive --depth 1）/ d（--recursive 不浅克隆）/ c,d'
        required: false
        default: 'a,b'
        type: string

  pull_request:
    paths:
      - 'test-squid/repro-gitcdn-unsynced-sha.sh'
      - 'test-squid/repro-gitcdn-latest.sh'
      - 'test-squid/repro-gitcdn-pytorch-submodule.sh'
      - 'test-squid/repro-gitcdn-rebuild.sh'
      - 'test-squid/repro-submodule-jobs-bench.sh'
      - '.github/workflows/test-gitcdn.yaml'

permissions:
  contents: write

jobs:
  gitcdn-unsynced:
    name: git-cdn 未同步 SHA 回源
    # 定时轮次只跑滚动校验，避免每 30 分钟造一次临时 ref
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ${{ fromJSON(inputs.runner || '["linux-amd64-cpu-2", "gy-006"]') }}
    permissions:
      contents: write   # 建/删临时 ref（造缓存缺失的 SHA）
    steps:
      - uses: actions/checkout@v7

      - name: 运行 git-cdn 未同步 SHA 回源
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
        run: bash test-squid/run-suite.sh --mode gitcdn-unsynced

      - name: 写入 Step Summary
        if: always()
        run: |
          {
            echo "## test-gitcdn 汇总"
            echo '```'
            cat /tmp/test-squid-results/timings.tsv 2>/dev/null || echo '(无 timings.tsv)'
            echo '```'
            echo
            echo "### gh-proxy 形态对照（机理留档）"
            echo '```'
            cat /tmp/test-squid-results/gitcdn-unsynced/ghproxy.tsv 2>/dev/null || echo '(无 ghproxy.tsv)'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-gitcdn-unsynced
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  # git-cdn-rebuild chart 灰度验证（ascend-ci-deployment#2567 / ADR-0015）：
  # 运行时补丁上移到镜像后，四项契约必须仍然成立：
  #   ① client_max_size 由 env CLIENT_MAX_SIZE_MB 控制（不能回落到 aiohttp 默认 1MB）
  #   ② 系统 gitconfig 内置 uploadpack.allowfilter（--filter=blob:none 要真裁剪）
  #   ③ refs/pull/* 不进 mirror（Patch 5）
  #   ④ 浅包缓存 + 流式转发仍然生效（同仓两次 clone 第二次不慢）
  gitcdn-rebuild:
    name: git-cdn-rebuild 灰度验证
    if: ${{ inputs.gitcdn_rebuild == '1' }}
    runs-on: ${{ fromJSON(inputs.runner || '["linux-amd64-cpu-2", "gy-006"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: 运行 git-cdn-rebuild 灰度验证
        run: bash test-squid/run-suite.sh --mode gitcdn-rebuild

      - name: 写入 Step Summary
        if: always()
        run: |
          {
            echo "## git-cdn-rebuild 灰度验证（ADR-0015）"
            echo "| 用例 | 结论 | 耗时(ms) | 备注 |"
            echo "|---|---|---|---|"
            awk -F'\t' '{printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4}' \
              /tmp/test-squid-results/gitcdn-rebuild/gitcdn-rebuild.tsv 2>/dev/null \
              || echo "| - | - | - | 无结果 |"
            echo
            echo "### /metrics 中的预热 / 缓存指标（留档）"
            echo '```'
            cat /tmp/test-squid-results/gitcdn-rebuild/metrics-warm.txt 2>/dev/null || echo '(无)'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-gitcdn-rebuild
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  # 最新 commit 滚动校验：每 30 分钟把所有仓库的上游最新 commit 经 git-cdn 取一遍，
  # 模拟正常使用 github.com 的姿势（先取最新 commit → fetch → checkout）。
  gitcdn-latest:
    name: git-cdn 最新 commit 滚动校验
    if: ${{ github.event_name == 'schedule' || inputs.latest == '1' }}
    runs-on: ${{ fromJSON(inputs.runner || '["linux-amd64-cpu-2", "gy-006"]') }}
    timeout-minutes: 90
    concurrency:
      group: gitcdn-latest
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: 取上游最新 commit 并经 git-cdn fetch + checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REPOS: ${{ inputs.latest_repos }}
          POSE: ${{ inputs.pose || 'fetch' }}
          CLONE_TIMEOUT: ${{ inputs.clone_timeout || '0' }}
        run: bash test-squid/repro-gitcdn-latest.sh

      - name: 写入 Step Summary
        if: always()
        run: |
          {
            echo "## test-gitcdn 最新 commit 滚动校验"
            echo "| 仓库 | 真值 SHA | git-cdn HEAD | 结论 | 备注 | 耗时(ms) |"
            echo "|---|---|---|---|---|---|"
            awk -F'\t' '{printf "| %s | %.9s | %.9s | %s | %s | %s |\n", $1, $3, $4, $6, $7, $8}' \
              /tmp/test-squid-results/gitcdn-latest/latest.tsv 2>/dev/null \
              || echo "| - | - | - | - | 无结果 | - |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-gitcdn-latest
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  # pytorch/pytorch「depth=1 + 子模块」耗时用例（opt-in，大流量）：
  # 主仓浅取 + 36 个子模块浅取全部经 git-cdn，分段计时回答「慢在主仓还是子模块」。
  gitcdn-pytorch-submodule:
    name: git-cdn pytorch depth1 + 子模块耗时
    if: ${{ inputs.pytorch_submodule == '1' }}
    runs-on: ${{ fromJSON(inputs.runner || '["linux-amd64-cpu-2", "gy-006"]') }}
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: 打印 git 版本
        run: git --version

      - name: 升级 git（需要 >=2.36 才支持 submodule update --filter）
        if: ${{ inputs.pytorch_git_upgrade == '1' }}
        run: |
          set -x
          # git submodule update -h 返回 129，直接接 grep 会被 pipefail 判成失败，先落成变量
          help_txt=$(git submodule update -h 2>&1 || true)
          case "$help_txt" in
            *--filter*) echo "当前 git 已支持 submodule update --filter，无需升级"; git --version; exit 0 ;;
          esac
          SUDO=""
          command -v sudo >/dev/null 2>&1 && SUDO=sudo
          $SUDO apt-get update -qq || true
          $SUDO apt-get install -y -qq software-properties-common || true
          $SUDO add-apt-repository -y ppa:git-core/ppa
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq git
          git --version
          help_txt=$(git submodule update -h 2>&1 || true)
          case "$help_txt" in
            *--filter*) echo "升级成功：已支持 --filter" ;;
            *) echo "升级后仍不支持 --filter"; exit 1 ;;
          esac

      - name: 经 git-cdn 克隆 pytorch 主仓 + 子模块（分段计时）
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.pytorch_runs || '1' }}
          SUBMODULES: ${{ inputs.pytorch_submodules }}
          JOBS_LADDER: ${{ inputs.pytorch_jobs_ladder }}
          WORK: ${{ inputs.pytorch_work_dir }}
          CLONE_TIMEOUT: ${{ inputs.clone_timeout || '0' }}
          TRACE_PERF: ${{ inputs.pytorch_trace_perf || '0' }}
        run: bash test-squid/repro-gitcdn-pytorch-submodule.sh

      - name: 写入 Step Summary
        if: always()
        run: |
          {
            echo "## git-cdn pytorch depth=1 + 子模块耗时"
            echo "| 轮次 | 阶段 | 耗时(ms) | 体积(MB) | 子模块数 | 结论 | 备注 |"
            echo "|---|---|---|---|---|---|---|"
            awk -F'\t' '{printf "| %s | %s | %s | %s | %s | %s | %s |\n", $1,$2,$3,$4,$5,$6,$7}' \
              /tmp/test-squid-results/gitcdn-pytorch/pytorch-submodule.tsv 2>/dev/null \
              || echo "| - | - | - | - | - | 无结果 | - |"
            echo
            echo "### 子模块明细（体积 Top 15）"
            echo '```'
            sort -t$'\t' -k4,4nr /tmp/test-squid-results/gitcdn-pytorch/submodules.tsv 2>/dev/null | head -15 \
              || echo '(无 submodules.tsv)'
            echo '```'
            echo
            echo "### git-cdn 缓存头（info/refs 探头）"
            echo '```'
            cat /tmp/test-squid-results/gitcdn-pytorch/refs-probe-run*.txt 2>/dev/null || echo '(无探头结果)'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-gitcdn-pytorch-submodule
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  # 第一层子模块扇出对照（opt-in）：验证 git 原生 --jobs 是否真的把第一层跑满。
  # 同主仓、同基址，只改被测变量：
  #   A = git submodule update --jobs 32（第一层，不带 --recursive）
  #   B = init 串行 + xargs -P 32 逐路径 update（第一层）
  #   C = update --recursive --depth 1 --jobs 32（一条命令）
  #   D = 同 C 但子模块不浅克隆（验证串行补 fetch 段是否消失、体积代价多少）
  subjobs-bench:
    name: 子模块扇出对照（--jobs 32 vs 手动 32 并发）
    if: ${{ inputs.subjobs_bench == '1' }}
    runs-on: ${{ fromJSON(inputs.runner || '["linux-amd64-cpu-2", "gy-006"]') }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: 运行第一层子模块扇出对照
        env:
          JOBS: '32'
          WORK: /tmp/subjobs-bench
          ORDER: ${{ inputs.subjobs_order || 'a,b' }}
        run: bash test-squid/repro-submodule-jobs-bench.sh

      - name: 写入 Step Summary
        if: always()
        run: |
          {
            echo "## 子模块扇出对照：git --jobs 32 vs 手动 32 并发"
            echo "| 用例 | 结论 | 耗时(ms) | 明细 |"
            echo "|---|---|---|---|"
            awk -F'\t' '{printf "| %s | %s | %s | %s |\n", $1,$2,$3,$4}' \
              /tmp/test-squid-results/subjobs/subjobs.tsv 2>/dev/null \
              || echo "| - | - | - | 无结果 |"
            echo
            echo "### 手动并发逐项耗时（Top 15，ms）"
            echo '```'
            sort -t$'\t' -k3,3nr /tmp/test-squid-results/subjobs/sub-times-manual.tsv 2>/dev/null | head -15 \
              || echo '(无 sub-times-manual.tsv)'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-gitcdn-subjobs-bench
          path: /tmp/test-squid-results/subjobs/
          if-no-files-found: warn

  # 环境对照基线（opt-in）：同一脚本、同一档位，但跑在 GitHub 托管 runner 上、
  # 直连 github.com（不经 git-cdn）。用于区分「命令/调度差异」与「链路差异」：
  #   - 若本 job 的各档位耗时与集群内接近 → 差异来自调度方式，与环境无关；
  #   - 若本 job 明显更快且各档位差别小 → 差异来自 git-cdn 链路本身（吞吐/首字节）。
  pytorch-baseline-github:
    name: pytorch 克隆基线（GitHub 托管 runner 直连 github.com）
    if: ${{ inputs.pytorch_baseline == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: 打印 git 版本
        run: git --version

      - name: 直连 github.com 克隆 pytorch 主仓 + 子模块（同脚本、同采样）
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CDN_BASE: https://github.com/
          RUNS: ${{ inputs.pytorch_runs || '1' }}
          SUBMODULES: ${{ inputs.pytorch_submodules }}
          JOBS_LADDER: ${{ inputs.pytorch_jobs_ladder }}
          CLONE_TIMEOUT: ${{ inputs.clone_timeout || '0' }}
          TRACE_PERF: ${{ inputs.pytorch_trace_perf || '0' }}
        run: bash test-squid/repro-gitcdn-pytorch-submodule.sh

      - name: 写入 Step Summary
        if: always()
        run: |
          {
            echo "## pytorch 克隆基线（GitHub 托管 runner，直连 github.com）"
            echo "| 轮次 | 阶段 | 耗时(ms) | 体积(MB) | 子模块数 | 结论 | 备注 |"
            echo "|---|---|---|---|---|---|---|"
            awk -F'\t' '{printf "| %s | %s | %s | %s | %s | %s | %s |\n", $1,$2,$3,$4,$5,$6,$7}' \
              /tmp/test-squid-results/gitcdn-pytorch/pytorch-submodule.tsv 2>/dev/null \
              || echo "| - | - | - | - | - | 无结果 | - |"
            echo
            echo "### 子模块明细（体积 Top 15）"
            echo '```'
            sort -t$'\t' -k4,4nr /tmp/test-squid-results/gitcdn-pytorch/submodules.tsv 2>/dev/null | head -15 \
              || echo '(无 submodules.tsv)'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-gitcdn-pytorch-baseline
          path: /tmp/test-squid-results/
          if-no-files-found: warn

