name: test-gitcdn

# git-cdn 服务本身的回归工作流（与 test-squid.yaml 分开）
#
# 区别：test-squid.yaml 测的是 squid（代理/CONNECT/MITM/缓存/重写），
# 本工作流只测 git-cdn 的**回源能力**，显式打 git-cdn 基址，
# 不依赖宿主的 insteadOf、不经过 squid。
#
# 用例：test-squid/repro-gitcdn-unsynced-sha.sh（META R23）
#   ① 用 API 造一个「上游可服务、git-cdn 缓存必定没有」的 SHA（临时 ref + 空提交）
#   ② 对照组：直连 github.com 取该 SHA，确认上游确实有（否则 SKIP）
#   ②b gh-proxy 入参形态对照：正确形态必须 200（否则判红）；缺前缀形态只留档
#   ③ 经 git-cdn 按真实客户端形态（Basic 凭据）取该 SHA
#      —— 成功 = git-cdn 回源健康；50s 后 not our ref = 缺陷复现（2026-11-04 事故）
#
# 需要 contents: write（建/删临时 ref）。
#
# 另含「最新 commit 滚动校验」job（gitcdn-latest）：
#   每 30 分钟（schedule）对 ascend-ci-deployment#2048 的构建仓及其依赖仓，
#   ① 先取上游最新 commit（真值），② 再经 git-cdn 取对象（POSE=fetch 默认：fetch --depth 1；
#   POSE=clone：全量 clone 后切 commit），③ 真值 commit 不在本地则按真值 SHA 回源取一次。
#   取不到最新 commit 即判红 —— 持续守 2026-11-04「缓存缺新 SHA → not our ref」这一类问题。

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'runner 标签 JSON 数组（数组内多标签为 AND 关系）'
        required: false
        default: '["linux-amd64-cpu-2", "gy-006"]'
        type: string
      latest:
        description: '1 = 立刻跑一次「最新 commit 滚动校验」（定时任务每 30 分钟自动跑）'
        required: false
        default: '1'
        type: string
      latest_repos:
        description: '滚动校验仓库清单（空格/逗号分隔 owner/repo；gitcode: 前缀走 gitcode 上游；空 = 默认清单）'
        required: false
        default: ''
        type: string
      pose:
        description: '取对象姿势：fetch = init + fetch --depth 1（默认）；clone = 全量 clone 后再切 commit'
        required: false
        default: 'fetch'
        type: choice
        options:
          - fetch
          - clone
      clone_timeout:
        description: '单仓取对象超时秒（0 = 按仓库体积自动估：体积/2+120，180~1200）'
        required: false
        default: '0'
        type: string
      pytorch_submodule:
        description: '1 = 启用 pytorch/pytorch「depth=1 + 全量子模块」经 git-cdn 的克隆耗时用例（大流量，仅手动）'
        required: false
        default: '0'
        type: string
      pytorch_runs:
        description: 'pytorch 用例轮数：1 = 只测一轮（冷缓存）；2 = 追加一轮热缓存对照'
        required: false
        default: '1'
        type: string
      pytorch_submodules:
        description: '限定子模块路径（空格分隔，如 third_party/cutlass third_party/flash-attention；空 = 全量 36 个）'
        required: false
        default: ''
        type: string
      pytorch_jobs_ladder:
        description: '子模块并发拨测档位（空格分隔，如 "1 8 32"）；非空时每档一轮全新克隆，忽略 pytorch_runs'
        required: false
        default: ''
        type: string

  schedule:
    # 每 30 分钟一轮：全部仓库重新取上游最新 commit，验证 git-cdn 可服务新提交
    - cron: '*/30 * * * *'

  pull_request:
    paths:
      - 'test-squid/repro-gitcdn-unsynced-sha.sh'
      - 'test-squid/repro-gitcdn-latest.sh'
      - 'test-squid/repro-gitcdn-pytorch-submodule.sh'
      - '.github/workflows/test-gitcdn.yaml'

permissions:
  contents: write

jobs:
  gitcdn-unsynced:
    name: git-cdn 未同步 SHA 回源
    # 定时轮次只跑滚动校验，避免每 30 分钟造一次临时 ref
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ${{ fromJSON(inputs.runner || '["linux-amd64-cpu-2", "gy-006"]') }}
    permissions:
      contents: write   # 建/删临时 ref（造缓存缺失的 SHA）
    steps:
      - uses: actions/checkout@v7

      - name: 运行 git-cdn 未同步 SHA 回源
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
        run: bash test-squid/run-suite.sh --mode gitcdn-unsynced

      - name: 写入 Step Summary
        if: always()
        run: |
          {
            echo "## test-gitcdn 汇总"
            echo '```'
            cat /tmp/test-squid-results/timings.tsv 2>/dev/null || echo '(无 timings.tsv)'
            echo '```'
            echo
            echo "### gh-proxy 形态对照（机理留档）"
            echo '```'
            cat /tmp/test-squid-results/gitcdn-unsynced/ghproxy.tsv 2>/dev/null || echo '(无 ghproxy.tsv)'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-gitcdn-unsynced
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  # 最新 commit 滚动校验：每 30 分钟把所有仓库的上游最新 commit 经 git-cdn 取一遍，
  # 模拟正常使用 github.com 的姿势（先取最新 commit → fetch → checkout）。
  gitcdn-latest:
    name: git-cdn 最新 commit 滚动校验
    if: ${{ github.event_name == 'schedule' || inputs.latest == '1' }}
    runs-on: ${{ fromJSON(inputs.runner || '["linux-amd64-cpu-2", "gy-006"]') }}
    timeout-minutes: 90
    concurrency:
      group: gitcdn-latest
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: 取上游最新 commit 并经 git-cdn fetch + checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REPOS: ${{ inputs.latest_repos }}
          POSE: ${{ inputs.pose || 'fetch' }}
          CLONE_TIMEOUT: ${{ inputs.clone_timeout || '0' }}
        run: bash test-squid/repro-gitcdn-latest.sh

      - name: 写入 Step Summary
        if: always()
        run: |
          {
            echo "## test-gitcdn 最新 commit 滚动校验"
            echo "| 仓库 | 真值 SHA | git-cdn HEAD | 结论 | 备注 | 耗时(ms) |"
            echo "|---|---|---|---|---|---|"
            awk -F'\t' '{printf "| %s | %.9s | %.9s | %s | %s | %s |\n", $1, $3, $4, $6, $7, $8}' \
              /tmp/test-squid-results/gitcdn-latest/latest.tsv 2>/dev/null \
              || echo "| - | - | - | - | 无结果 | - |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-gitcdn-latest
          path: /tmp/test-squid-results/
          if-no-files-found: warn

  # pytorch/pytorch「depth=1 + 子模块」耗时用例（opt-in，大流量）：
  # 主仓浅取 + 36 个子模块浅取全部经 git-cdn，分段计时回答「慢在主仓还是子模块」。
  gitcdn-pytorch-submodule:
    name: git-cdn pytorch depth1 + 子模块耗时
    if: ${{ inputs.pytorch_submodule == '1' }}
    runs-on: ${{ fromJSON(inputs.runner || '["linux-amd64-cpu-2", "gy-006"]') }}
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: 经 git-cdn 克隆 pytorch 主仓 + 子模块（分段计时）
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.pytorch_runs || '1' }}
          SUBMODULES: ${{ inputs.pytorch_submodules }}
          JOBS_LADDER: ${{ inputs.pytorch_jobs_ladder }}
          CLONE_TIMEOUT: ${{ inputs.clone_timeout || '0' }}
        run: bash test-squid/repro-gitcdn-pytorch-submodule.sh

      - name: 写入 Step Summary
        if: always()
        run: |
          {
            echo "## git-cdn pytorch depth=1 + 子模块耗时"
            echo "| 轮次 | 阶段 | 耗时(ms) | 体积(MB) | 子模块数 | 结论 | 备注 |"
            echo "|---|---|---|---|---|---|---|"
            awk -F'\t' '{printf "| %s | %s | %s | %s | %s | %s | %s |\n", $1,$2,$3,$4,$5,$6,$7}' \
              /tmp/test-squid-results/gitcdn-pytorch/pytorch-submodule.tsv 2>/dev/null \
              || echo "| - | - | - | - | - | 无结果 | - |"
            echo
            echo "### 子模块明细（体积 Top 15）"
            echo '```'
            sort -t$'\t' -k4,4nr /tmp/test-squid-results/gitcdn-pytorch/submodules.tsv 2>/dev/null | head -15 \
              || echo '(无 submodules.tsv)'
            echo '```'
            echo
            echo "### git-cdn 缓存头（info/refs 探头）"
            echo '```'
            cat /tmp/test-squid-results/gitcdn-pytorch/refs-probe-run*.txt 2>/dev/null || echo '(无探头结果)'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-gitcdn-pytorch-submodule
          path: /tmp/test-squid-results/
          if-no-files-found: warn

