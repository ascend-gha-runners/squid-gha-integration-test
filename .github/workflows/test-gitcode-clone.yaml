# =============================================================================
# test-gitcode-clone —— 只测 gitcode clone 的性能（R22）
#
# 与 test-squid.yaml 里的 gitcode 组不同，本 workflow 不做 refs 探测、不做 LFS、
# 只回答一个问题：同一个仓库重复 clone，走缓存后端到底多快？
#
#   - 第 1 次 clone = 冷启动（同时写入后端缓存）
#   - 第 2..N 次 = 热路径，取中位数与冷启动对比
#   - baseline=1 时额外克隆一次上游 gitcode.com（用 GIT_CONFIG_GLOBAL=/dev/null
#     跳过 insteadOf）作为对照
#   - ladder 非空时按并发阶梯同时 clone N 份（测墙钟/延迟放大/聚合吞吐）
#   - github_clone=1 时额外克隆一个 github.com 仓库作对照：job pod 模板的
#     postStart 会把 github.com 重写到 git-cdn 的 github 实例（与 gitcode 是
#     两套独立后端），所以这项测的是 github 侧缓存，不是 gh-proxy 直连
#
# 前提（同 test-squid）：目标 runner 的 job pod 模板 postStart 已注入
#   url.<backend>.insteadOf = https://gitcode.com/
# 故必须跑容器层（runner 容器没有这条重写）。
#
# 示例（User 的 LFS 测试仓，跑在 wlcb001 容器层）：
#   gh workflow run test-gitcode-clone.yaml --ref main \
#     -f runner='["linux-aarch64-a2-1-wlcb001"]' \
#     -f gitcode_backend='git-cdn-gitcode' \
#     -f repo='https://gitcode.com/ccijunk/lfs-test.git' \
#     -f iterations='3' \
#     -f lfs_verify='1' \
#     -f github_clone='0'
#   效果：先断言重写展开到
#   http://git-cdn-service.git-cdn-gitcode.svc.cluster.local:8000/ccijunk/lfs-test.git，
#   再 3 次 clone 做冷/热耗时对比，最后 git lfs pull 逐文件校验 sha256 == pointer oid。
# =============================================================================
name: test-gitcode-clone

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'runner 标签（JSON 数组字符串，多标签=AND；需已注入 gitcode 重写）'
        required: false
        default: '["linux-amd64-cpu-2", "gy-006"]'
      gitcode_backend:
        description: '缓存后端'
        required: false
        type: choice
        options:
          - git-cdn-gitcode
          - smart-git-proxy
        default: git-cdn-gitcode
      expect_backend:
        description: '期望后端基址（空=按 gitcode_backend 推导；测 github 仓库时填 http://git-cdn-service.git-cdn.svc.cluster.local:8000）'
        required: false
        default: ''
      repo:
        description: 'clone 目标仓库'
        required: false
        default: 'https://gitcode.com/cann/catlass.git'
      clone_mode:
        description: 'full=--single-branch（可进 pack 缓存）/ shallow=--depth 1'
        required: false
        type: choice
        options:
          - full
          - shallow
        default: full
      iterations:
        description: '克隆次数（第 1 次冷启动，其余为热路径）'
        required: false
        default: '5'
      ref:
        description: 'clone 后 checkout 到该 commit/branch（空=默认分支；校验历史版本下载用）'
        required: false
        default: ''
      lfs_verify:
        description: '1=clone 后 git lfs pull 并校验 sha256 == pointer oid'
        required: false
        default: '0'
      lfs_include:
        description: 'LFS 只拉指定路径（git lfs pull -I，空=全部）'
        required: false
        default: ''
      lfs_skip_smudge:
        description: '1=clone 只取 pointer，LFS 下载挪到显式 pull（观察 MISS→HIT 用；默认 0 贴近真实 CI）'
        required: false
        default: '0'
      ladder:
        description: '并发阶梯（空格分隔，如 "1 4 8"）；空=只测串行（默认关）'
        required: false
        default: ''
      github_clone:
        description: '1=额外测 github.com clone（走 postStart 注入的重写 → git-cdn 的 github 实例，另一套后端）'
        required: false
        default: '1'
      github_repo:
        description: 'github 对照仓库（空=本测试仓库）'
        required: false
        default: ''
      github_iterations:
        description: 'github 对照克隆次数'
        required: false
        default: '3'
      baseline:
        description: '1=额外克隆一次上游 gitcode.com 作对照'
        required: false
        default: '0'
      container_image:
        description: 'CANN 容器镜像（跨集群拉取慢时可换 quay 就近源）'
        required: false
        default: 'swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12'
      timeout_minutes:
        description: 'job 超时（大仓库全量 clone 需放宽，如 pytorch 建议 120）'
        required: false
        default: '40'

jobs:
  clone-bench:
    name: gitcode clone 性能（容器层）
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '40') }}
    container:
      image: ${{ inputs.container_image }}
    steps:
      - uses: actions/checkout@v7

      - name: 运行 clone 性能测试
        env:
          GITCODE_REPO: ${{ inputs.repo }}
          # 两种后端只差基址：smart-git-proxy 带 /gitcode.com 前缀段，
          # git-cdn-gitcode 直接以仓库路径挂在根上；
          # 脚本从 insteadOf 展开结果反推基址，这里只作为期望值断言。
          GITCODE_PROXY: ${{ inputs.expect_backend != '' && inputs.expect_backend || (inputs.gitcode_backend == 'git-cdn-gitcode' && 'http://git-cdn-service.git-cdn-gitcode.svc.cluster.local:8000' || 'http://smart-git-proxy-service.smart-git-proxy.svc.cluster.local:8080') }}
          CLONE_MODE: ${{ inputs.clone_mode }}
          ITERATIONS: ${{ inputs.iterations }}
          REF: ${{ inputs.ref }}
          LFS_VERIFY: ${{ inputs.lfs_verify }}
          LFS_SKIP_SMUDGE: ${{ inputs.lfs_skip_smudge }}
          LFS_INCLUDE: ${{ inputs.lfs_include }}
          LADDER: ${{ inputs.ladder }}
          GITHUB_CLONE: ${{ inputs.github_clone }}
          GITHUB_REPO: ${{ inputs.github_repo }}
          GITHUB_ITERATIONS: ${{ inputs.github_iterations }}
          BASELINE: ${{ inputs.baseline }}
          REWRITE_STRICT: '1'
          RESULTS_DIR: /tmp/gitcode-bench
        run: bash test-squid/gitcode-clone-bench.sh

      - name: 写入 Summary
        if: always()
        run: cat /tmp/gitcode-bench/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitcode-clone-bench
          path: /tmp/gitcode-bench/
          if-no-files-found: warn
